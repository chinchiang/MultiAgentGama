# VibeHarness-MAS Agent Configuration
# Supports multi-model de-biasing by mapping distinct LLMs to each agent

global:
  execution_mode: "hybrid"  # "live" (calls APIs), "mock" (offline/dry-run for testing), or "hybrid"
  timeout_seconds: 60             # per LLM request
  max_retries: 2                  # LLM request retries before falling back to fallback_model
  max_output_tokens: 4096         # per LLM response
  sandbox_provider: "local_subprocess"  # Only "local_subprocess" is implemented (docker / e2b are planned)
  sandbox_timeout_seconds: 120    # budget for one batched pytest run
  per_test_timeout_seconds: 30    # budget per test when a timed-out batch is re-run test by test

models:
  # Provider definitions. `model` / `fallback_model` are litellm model strings; the key is read from api_key_env.
  # fallback_model is tried once when the primary model still fails after max_retries.
  claude:
    model: "claude-sonnet-5"
    api_key_env: "ANTHROPIC_API_KEY"
    fallback_model: "claude-haiku-4-5-20251001"
    provider: "anthropic"

  nemotron:
    model: "nvidia_nim/nvidia/nemotron-4-340b-instruct"
    api_key_env: "NVIDIA_API_KEY"
    api_base: "https://integrate.api.nvidia.com/v1"
    fallback_model: "nvidia_nim/meta/llama-3.3-70b-instruct"
    provider: "nvidia"

  chatgpt:
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    fallback_model: "gpt-4o-mini"
    provider: "openai"

agents:
  # 1. White-Box Agents (Multi-Model Ensemble to eliminate bias)
  whitebox_reviewer_claude:
    name: "Logic & State Reviewer (Claude)"
    model_alias: "claude"
    temperature: 0.2
    focus: "Deep logical edge cases, unhandled exception states, state inconsistencies, hidden null-pointer/type bugs"

  whitebox_reviewer_nemotron:
    name: "Safety & Defensive Reviewer (Nemotron)"
    model_alias: "nemotron"
    temperature: 0.1
    focus: "Input sanitization, defensive guards, resource exhaustion, unsafe memory/buffer/concurrency"

  whitebox_reviewer_chatgpt:
    name: "Specification & Contract Reviewer (ChatGPT)"
    model_alias: "chatgpt"
    temperature: 0.2
    focus: "API signature compliance, business specification adherence, contract violations, standard test coverage"

  whitebox_debater:
    name: "Multi-Model Debate & Arbiter Agent"
    model_alias: "claude"
    temperature: 0.1
    role: "Synthesizes multi-model reviews, resolves disputes, eliminates hallucinations and false positives"

  whitebox_test_generator:
    name: "Property & Unit Test Generator"
    model_alias: "chatgpt"
    temperature: 0.3
    role: "Generates executable Pytest test modules targeting identified blindspots"

  # 2. Black-Box Agents (Threat-Model Driven)
  blackbox_threat_modeler:
    name: "STRIDE Threat Modeler Agent"
    model_alias: "claude"
    temperature: 0.2
    role: "Extracts trust boundaries, assets, and builds STRIDE & OWASP risk matrix"

  blackbox_test_synthesizer:
    name: "Security Scenario & Exploit Test Generator"
    model_alias: "chatgpt"
    temperature: 0.2
    role: "Translates threat scenarios into automated black-box tests (BOLA, Injection, Rate-limit)"

  # Planned (not yet implemented): a dynamic fuzzing / DAST runner agent.
