repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # 釘在 tag 指向的 commit SHA（pre-commit 的 frozen rev；tag 可被改指，SHA 不會），行尾註解是版本，
    # 與 requirements-dev.txt 的 ruff 釘版保持一致（tests/test_review_build.py 會檢查）。Dependabot 的 pre-commit 生態系會一併升 SHA 與註解
    # Pinned to the commit SHA the tag points to (pre-commit's frozen rev; a tag can be moved, a SHA cannot), with the
    # version in the trailing comment, kept in sync with the ruff pin in requirements-dev.txt (tests/test_review_build.py
    # checks it). Dependabot's pre-commit ecosystem bumps the SHA and the comment together
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff
  # mypy 在專案環境執行（與 CI lint job 相同的釘版 mypy 與真實相依套件），
  # 不用隔離的 hook 環境（那得再列一次所有執行期相依）。
  # mypy runs from the project environment (same pinned mypy and real dependencies as CI's lint job),
  # not from an isolated hook env that would need every runtime dependency listed again.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy vibeharness/ main.py
        language: system
        pass_filenames: false
        files: \.py$
      # repo 結構的檢查（README 目錄樹、雙語註解、sdist 內容與釘版）只花幾秒，
      # 但平常只在全套測試裡跑：只跑相關測試的 commit 會漏掉它們，例如新增測試檔卻沒列進兩份 README 的目錄樹（#128）
      # The repo-structure checks (README trees, bilingual comments, sdist contents and pins) take a few seconds but otherwise
      # run only in the full suite, so a commit that ran only the related tests misses them, e.g. a new test file not
      # listed in both README trees (#128)
      - id: repo-structure
        name: repo structure tests
        entry: python -m pytest -q -p no:cacheprovider tests/test_repo_docs.py tests/test_i18n.py tests/test_review_build.py
        language: system
        pass_filenames: false
        always_run: true
