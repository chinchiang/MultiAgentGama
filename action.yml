name: "VibeHarness-MAS audit"
description: >-
  Multi-agent white-box review, cross-model verification, sandboxed test execution and
  threat-modeled black-box attack tests for vibe-coded projects. Writes a Markdown / JSON report
  and a SARIF file for GitHub Code Scanning; the verdict is exposed as outputs.
author: chinchiang
branding:
  icon: shield
  color: purple

# Usage (in the target repository):
#   - uses: chinchiang/MultiAgentGama@v0.3.0
#     with:
#       target: src
#       mode: hybrid
#       max-model-calls: "80"
#       baseline: .vibeharness/baseline.json        # optional: only new problems fail the job
#     env:
#       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#       ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
#       DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
#       GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
#   - uses: github/codeql-action/upload-sarif@v3
#     with:
#       sarif_file: vibeharness.sarif
# The provider keys are read from the environment; the action never prints them. The audited code
# is sent to every configured provider (hard-coded secrets are redacted first).

inputs:
  target:
    description: "Directory or file to audit, relative to the workspace"
    default: "."
  mode:
    description: "live (real models only, fail without a key), hybrid (simulate agents without a key) or mock"
    default: "hybrid"
  max-model-calls:
    description: "Cost guard: real model calls per run (0 = unlimited)"
    default: "0"
  max-files:
    description: "Source files analyzed per run"
    default: "50"
  changed-since:
    description: "Only analyze files changed since this git ref (e.g. origin/main); empty = all files"
    default: ""
  baseline:
    description: "Path to a previous JSON report; problems it contains are reported but do not fail the job"
    default: ""
  output:
    description: "Report path (Markdown unless format is json)"
    default: "vibeharness-report.md"
  format:
    description: "Report format: md or json"
    default: "md"
  sarif:
    description: "SARIF output path; empty disables"
    default: "vibeharness.sarif"
  extra-args:
    description: "Additional CLI arguments, e.g. --exclude 'tests/*' --cache-dir .vibeharness-cache"
    default: ""
  python-version:
    description: "Python version to set up"
    default: "3.12"
  fail-on:
    description: >-
      Lowest verdict that fails the job: blocked (only BLOCKED_CRITICAL_RISK), needs-fixes
      (BLOCKED or NEEDS_FIXES), inconclusive (anything but READY_TO_SHIP) or never
    default: "needs-fixes"

outputs:
  verdict:
    description: "READY_TO_SHIP | NEEDS_FIXES | BLOCKED_CRITICAL_RISK | INCONCLUSIVE (or ERROR when the harness itself failed)"
    value: ${{ steps.audit.outputs.verdict }}
  exit-code:
    description: "The CLI exit code (0-3 verdicts, 4 live failure, 5 harness error)"
    value: ${{ steps.audit.outputs.exit-code }}
  report:
    description: "Path of the written report"
    value: ${{ inputs.output }}
  sarif:
    description: "Path of the written SARIF file (empty when disabled)"
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install VibeHarness-MAS
      shell: bash
      run: |
        # The action's own ref (tag or SHA) is installed, so the audit and the action version always match.
        # Once the package is on PyPI this can become: pip install "vibeharness-mas==<version>"
        python -m pip install --quiet "git+https://github.com/chinchiang/MultiAgentGama@${{ github.action_ref }}"

    - name: Run the audit
      id: audit
      shell: bash
      env:
        VH_TARGET: ${{ inputs.target }}
        VH_MODE: ${{ inputs.mode }}
        VH_MAX_CALLS: ${{ inputs.max-model-calls }}
        VH_MAX_FILES: ${{ inputs.max-files }}
        VH_CHANGED_SINCE: ${{ inputs.changed-since }}
        VH_BASELINE: ${{ inputs.baseline }}
        VH_OUTPUT: ${{ inputs.output }}
        VH_FORMAT: ${{ inputs.format }}
        VH_SARIF: ${{ inputs.sarif }}
        VH_EXTRA: ${{ inputs.extra-args }}
        VH_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set +e
        args=(--target "$VH_TARGET" --mode "$VH_MODE" --max-model-calls "$VH_MAX_CALLS" --max-files "$VH_MAX_FILES"
              --output "$VH_OUTPUT" --format "$VH_FORMAT")
        [ -n "$VH_CHANGED_SINCE" ] && args+=(--changed-since "$VH_CHANGED_SINCE")
        [ -n "$VH_BASELINE" ] && args+=(--baseline "$VH_BASELINE")
        [ -n "$VH_SARIF" ] && args+=(--sarif "$VH_SARIF")
        # shellcheck disable=SC2206
        extra=($VH_EXTRA)
        vibeharness "${args[@]}" "${extra[@]}"
        rc=$?
        set -e
        case "$rc" in
          0) verdict=READY_TO_SHIP ;;
          1) verdict=NEEDS_FIXES ;;
          2) verdict=BLOCKED_CRITICAL_RISK ;;
          3) verdict=INCONCLUSIVE ;;
          *) verdict=ERROR ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        echo "## VibeHarness-MAS: $verdict (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
        echo "Report: \`$VH_OUTPUT\`$( [ -n "$VH_SARIF" ] && echo ", SARIF: \`$VH_SARIF\`" )" >> "$GITHUB_STEP_SUMMARY"
        if [ "$rc" -ge 4 ]; then echo "::error::VibeHarness-MAS could not complete the audit (exit $rc)"; exit "$rc"; fi
        case "$VH_FAIL_ON" in
          never) exit 0 ;;
          blocked) [ "$rc" -eq 2 ] && exit 1 ;;
          needs-fixes) [ "$rc" -eq 1 ] || [ "$rc" -eq 2 ] && exit 1 ;;
          inconclusive) [ "$rc" -ne 0 ] && exit 1 ;;
          *) echo "::error::unknown fail-on value '$VH_FAIL_ON'"; exit 5 ;;
        esac
        exit 0

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      if: always()
      with:
        name: vibeharness-report
        path: |
          ${{ inputs.output }}
          ${{ inputs.output }}.partial.json
          ${{ inputs.sarif }}
        if-no-files-found: ignore
