name: "VibeHarness-MAS audit"
description: >-
  針對 vibe coding 專案的多代理白箱審查、跨模型驗證、沙盒測試執行與威脅建模黑箱攻擊測試；
  輸出 Markdown／JSON 報告與 GitHub Code Scanning 用的 SARIF，判定以 outputs 提供。
  Multi-agent white-box review, cross-model verification, sandboxed test execution and
  threat-modeled black-box attack tests for vibe-coded projects. Writes a Markdown / JSON report
  and a SARIF file for GitHub Code Scanning; the verdict is exposed as outputs.
author: chinchiang
branding:
  icon: shield
  color: purple

# 用法（在目標 repo 中）／ Usage (in the target repository):
#   - uses: chinchiang/MultiAgentGama@v0.6.0
#     with:
#       target: src
#       mode: hybrid
#       max-model-calls: "80"
#       baseline: .vibeharness/baseline.json        # 可選：只有新問題會讓 job 失敗 ／ optional: only new problems fail the job
#     env:
#       ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#       ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
#       DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
#       GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
#   - uses: github/codeql-action/upload-sarif@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
#     with:
#       sarif_file: vibeharness.sarif
# 供應商金鑰從環境變數讀取，action 不會印出。受稽核的程式碼會送到每一家設定的供應商（寫死的密鑰會先遮蔽）。
# The provider keys are read from the environment; the action never prints them. The audited code
# is sent to every configured provider (hard-coded secrets are redacted first).

inputs:
  target:
    description: "要稽核的目錄或檔案（相對於 workspace）／ Directory or file to audit, relative to the workspace"
    default: "."
  mode:
    description: "live（只用真實模型，缺金鑰即失敗）、hybrid（缺金鑰的 agent 改用模擬）或 mock ／ live (real models only, fail without a key), hybrid (simulate agents without a key) or mock"
    default: "hybrid"
  max-model-calls:
    description: "成本防護：每次執行的真實模型呼叫數（0 = 不限）／ Cost guard: real model calls per run (0 = unlimited)"
    default: "0"
  max-files:
    description: "每次執行分析的原始碼檔案數 ／ Source files analyzed per run"
    default: "50"
  changed-since:
    description: "只分析自此 git ref 以來有變更的檔案（例如 origin/main）；留空 = 全部 ／ Only analyze files changed since this git ref (e.g. origin/main); empty = all files"
    default: ""
  baseline:
    description: "先前 JSON 報告的路徑；其中已有的問題會列出但不會讓 job 失敗 ／ Path to a previous JSON report; problems it contains are reported but do not fail the job"
    default: ""
  output:
    description: "報告路徑（format 不是 json 時為 Markdown）／ Report path (Markdown unless format is json)"
    default: "vibeharness-report.md"
  format:
    description: "報告格式：md 或 json ／ Report format: md or json"
    default: "md"
  sarif:
    description: "SARIF 輸出路徑；留空則不產生 ／ SARIF output path; empty disables"
    default: "vibeharness.sarif"
  extra-args:
    description: "額外的 CLI 參數，例如 --exclude 'tests/*' --cache-dir .vibeharness-cache ／ Additional CLI arguments, e.g. --exclude 'tests/*' --cache-dir .vibeharness-cache"
    default: ""
  python-version:
    description: "要安裝的 Python 版本 ／ Python version to set up"
    default: "3.12"
  mutation:
    description: "突變測試：true 開啟、false 關閉、留空沿用設定檔的 global.mutation_testing ／ Mutation testing: true on, false off, empty follows global.mutation_testing in the config"
    default: ""
  sandbox:
    description: >-
      生成測試的沙盒：local_subprocess（預設；沿用設定檔的 sandbox_provider，內建設定檔即為 local_subprocess，不是安全邊界）
      或 docker（從 action 自帶的 docker/sandbox.Dockerfile 與 sandbox-node.Dockerfile 建置沙盒映像，並以
      sandbox_provider: docker 的設定檔覆本執行；需要有 Docker 的 runner，例如 ubuntu-latest）。extra-args 有 --config 時，
      docker 以該設定檔為底稿 ／
      Sandbox for generated tests: local_subprocess (default; keeps the config's sandbox_provider, which is
      local_subprocess in the bundled config and is NOT a security boundary) or docker (builds the sandbox images from
      the action's own docker/sandbox.Dockerfile and sandbox-node.Dockerfile and runs with a copy of the config set to
      sandbox_provider: docker; needs a runner with Docker, e.g. ubuntu-latest). With --config in extra-args, docker
      uses that file as the base
    default: "local_subprocess"
  artifact-name:
    description: >-
      上傳報告、SARIF 與 .partial.json 的 artifact 名稱；同一個 workflow 執行內 artifact 名稱不可重複，
      矩陣或多次呼叫時每一格要設不同的名稱（例如以 matrix 值組成的 vibeharness-report-src）／
      Name of the artifact holding the report, SARIF and .partial.json; artifact names must be unique within a
      workflow run, so matrix jobs or repeated uses must each set a distinct one (e.g. vibeharness-report-src built from a matrix value)
    default: "vibeharness-report"
  fail-on:
    description: >-
      讓 job 失敗的最低判定：blocked（只有 BLOCKED_CRITICAL_RISK）、needs-fixes（BLOCKED 或 NEEDS_FIXES）、
      inconclusive（READY_TO_SHIP 以外全部）或 never ／
      Lowest verdict that fails the job: blocked (only BLOCKED_CRITICAL_RISK), needs-fixes
      (BLOCKED or NEEDS_FIXES), inconclusive (anything but READY_TO_SHIP) or never
    default: "needs-fixes"

outputs:
  verdict:
    description: "READY_TO_SHIP | NEEDS_FIXES | BLOCKED_CRITICAL_RISK | INCONCLUSIVE（harness 本身失敗時為 ERROR）／ (or ERROR when the harness itself failed)"
    value: ${{ steps.audit.outputs.verdict }}
  exit-code:
    description: "CLI 的 exit code（0-3 判定、4 live 失敗、5 harness 錯誤）／ The CLI exit code (0-3 verdicts, 4 live failure, 5 harness error)"
    value: ${{ steps.audit.outputs.exit-code }}
  report:
    description: "寫出的報告路徑 ／ Path of the written report"
    value: ${{ inputs.output }}
  sarif:
    description: "寫出的 SARIF 路徑（未啟用時為空）／ Path of the written SARIF file (empty when disabled)"
    value: ${{ inputs.sarif }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install VibeHarness-MAS ／ 安裝 VibeHarness-MAS
      shell: bash
      env:
        VH_ACTION_REF: ${{ github.action_ref }}
      run: |
        # 從 runner 已經取出的 action 本身安裝（$GITHUB_ACTION_PATH），稽核版本永遠與 action 版本一致，
        # `uses: owner/repo@ref` 與 `uses: ./` 都適用，也不需要再從網路抓一次原始碼。
        # 相依套件與建置後端（setuptools）先以 requirements.lock／requirements-build.txt 帶雜湊安裝（--require-hashes），
        # 再以 --no-deps --no-build-isolation 安裝套件本身：建置不會另外抓未釘版的 setuptools，整個安裝都經雜湊驗證。
        # 原始碼先複製到 $RUNNER_TEMP 再建置，建置產物（build/、*.egg-info）不會落在 action 目錄或 workspace。
        # Install from the action's own copy the runner already fetched ($GITHUB_ACTION_PATH), so the audit
        # always matches the action version; works for both `uses: owner/repo@ref` and `uses: ./`, with no
        # second source download. Dependencies and the build backend (setuptools) are installed hash-verified
        # from requirements.lock / requirements-build.txt (--require-hashes), then the package itself with
        # --no-deps --no-build-isolation: the build never fetches an unpinned setuptools, so the whole install is
        # hash-verified. The sources are copied to $RUNNER_TEMP before building so build output (build/,
        # *.egg-info) never lands in the action directory or the workspace.
        if [ -z "$GITHUB_ACTION_PATH" ] || [ ! -f "$GITHUB_ACTION_PATH/pyproject.toml" ] \
          || [ ! -f "$GITHUB_ACTION_PATH/requirements.lock" ] || [ ! -f "$GITHUB_ACTION_PATH/requirements-build.txt" ]; then
          echo "::error::VibeHarness-MAS action sources not found at GITHUB_ACTION_PATH='$GITHUB_ACTION_PATH' (ref '${VH_ACTION_REF:-<none>}')"
          exit 5
        fi
        echo "Installing VibeHarness-MAS from $GITHUB_ACTION_PATH (ref ${VH_ACTION_REF:-local})"
        src="$RUNNER_TEMP/vibeharness-src"
        rm -rf "$src" && mkdir -p "$src"
        # pyproject.toml 的 readme 指向 README.en.md，建置時必須存在 ／ pyproject.toml's readme points at README.en.md, which the build needs
        cp -R "$GITHUB_ACTION_PATH/pyproject.toml" "$GITHUB_ACTION_PATH/README.md" "$GITHUB_ACTION_PATH/README.en.md" \
          "$GITHUB_ACTION_PATH/LICENSE" "$GITHUB_ACTION_PATH/MANIFEST.in" "$GITHUB_ACTION_PATH/vibeharness" "$src/"
        python -m pip install --quiet --require-hashes -r "$GITHUB_ACTION_PATH/requirements.lock" \
          -r "$GITHUB_ACTION_PATH/requirements-build.txt"
        python -m pip install --quiet --no-deps --no-build-isolation "$src"
        python -m pip check

    - name: Build the Docker sandbox images ／ 建置 Docker 沙盒映像
      if: inputs.sandbox == 'docker'
      shell: bash
      run: |
        # 映像從 action 自帶的 Dockerfile 建置（基底以 digest 釘死、測試工具帶雜湊安裝），版本與 action 一致
        # The images are built from the action's own Dockerfiles (digest-pinned bases, hash-verified test tools),
        # so they match the action version
        if ! command -v docker >/dev/null 2>&1; then
          echo "::error::sandbox: docker needs a runner with Docker (e.g. ubuntu-latest)"
          exit 5
        fi
        docker build --quiet -t vibeharness-sandbox:latest -f "$GITHUB_ACTION_PATH/docker/sandbox.Dockerfile" "$GITHUB_ACTION_PATH"
        docker build --quiet -t vibeharness-sandbox-node:latest -f "$GITHUB_ACTION_PATH/docker/sandbox-node.Dockerfile" "$GITHUB_ACTION_PATH"

    - name: Run the audit ／ 執行稽核
      id: audit
      shell: bash
      env:
        VH_TARGET: ${{ inputs.target }}
        VH_MODE: ${{ inputs.mode }}
        VH_MAX_CALLS: ${{ inputs.max-model-calls }}
        VH_MAX_FILES: ${{ inputs.max-files }}
        VH_CHANGED_SINCE: ${{ inputs.changed-since }}
        VH_BASELINE: ${{ inputs.baseline }}
        VH_OUTPUT: ${{ inputs.output }}
        VH_FORMAT: ${{ inputs.format }}
        VH_SARIF: ${{ inputs.sarif }}
        VH_EXTRA: ${{ inputs.extra-args }}
        VH_MUTATION: ${{ inputs.mutation }}
        VH_FAIL_ON: ${{ inputs.fail-on }}
        VH_SANDBOX: ${{ inputs.sandbox }}
      run: |
        # extra-args 以 shlex 規則切字（引號有效；不執行任何 shell、不展開 glob）；切不開就以 exit 5 失敗
        # extra-args is split by shlex rules (quotes work; no shell execution, no glob expansion); unparsable input exits 5
        # extra-args-split-begin
        python -c 'import shlex, sys; sys.stdout.write("".join(a + "\0" for a in shlex.split(sys.argv[1])))' "$VH_EXTRA" > "$RUNNER_TEMP/vh_extra_args" \
          || { echo "::error::extra-args could not be parsed: $VH_EXTRA"; exit 5; }
        extra=()
        while IFS= read -r -d '' arg; do extra+=("$arg"); done < "$RUNNER_TEMP/vh_extra_args"
        # extra-args-split-end
        # sandbox: docker → 以設定檔（extra-args 的 --config，否則套件內建的）為底稿寫一份 sandbox_provider: docker 的覆本，
        # 並把 --config 放在最後（argparse 取最後一個）。CLI 沒有 --sandbox 旗標，所以走設定檔
        # sandbox: docker → write a copy of the config (extra-args' --config, else the bundled one) with
        # sandbox_provider: docker and pass --config last (argparse keeps the last one). The CLI has no --sandbox
        # flag, so this goes through the config file
        config_override=()
        case "$VH_SANDBOX" in
          local_subprocess) ;;
          docker)
            cfg="$RUNNER_TEMP/vibeharness-sandbox-config.yaml"
            python - "$RUNNER_TEMP/vh_extra_args" "$cfg" <<'PY' || { echo "::error::could not write the docker sandbox config"; exit 5; }
        import sys
        import yaml
        from vibeharness.core.llm_gateway import DEFAULT_CONFIG_PATH
        with open(sys.argv[1], encoding="utf-8") as f:
            args = [a for a in f.read().split("\0") if a]
        base = DEFAULT_CONFIG_PATH
        for i, arg in enumerate(args):
            if arg in ("--config", "-c") and i + 1 < len(args):
                base = args[i + 1]
            elif arg.startswith("--config="):
                base = arg.split("=", 1)[1]
            elif arg.startswith("-c") and len(arg) > 2:
                base = arg[2:]
        with open(base, encoding="utf-8") as f:
            config = yaml.safe_load(f) or {}
        config.setdefault("global", {})["sandbox_provider"] = "docker"
        with open(sys.argv[2], "w", encoding="utf-8") as f:
            yaml.safe_dump(config, f, allow_unicode=True, sort_keys=False)
        print(f"sandbox: docker (config based on {base})")
        PY
            config_override=(--config "$cfg") ;;
          *) echo "::error::unknown sandbox value '$VH_SANDBOX' (use local_subprocess or docker)"; exit 5 ;;
        esac
        set +e
        args=(--target "$VH_TARGET" --mode "$VH_MODE" --max-model-calls "$VH_MAX_CALLS" --max-files "$VH_MAX_FILES"
              --output "$VH_OUTPUT" --format "$VH_FORMAT")
        [ -n "$VH_CHANGED_SINCE" ] && args+=(--changed-since "$VH_CHANGED_SINCE")
        [ -n "$VH_BASELINE" ] && args+=(--baseline "$VH_BASELINE")
        [ -n "$VH_SARIF" ] && args+=(--sarif "$VH_SARIF")
        # 突變測試開關：true／false 轉成旗標，留空則不加（沿用設定檔） ／ mutation switch: true / false become a flag, empty adds none (the config decides)
        case "$VH_MUTATION" in
          true) args+=(--mutation) ;;
          false) args+=(--no-mutation) ;;
          "") ;;
          *) echo "::error::unknown mutation value '$VH_MUTATION' (use true, false or leave empty)"; exit 5 ;;
        esac
        vibeharness "${args[@]}" "${extra[@]}" "${config_override[@]}"
        rc=$?
        set -e
        case "$rc" in
          0) verdict=READY_TO_SHIP ;;
          1) verdict=NEEDS_FIXES ;;
          2) verdict=BLOCKED_CRITICAL_RISK ;;
          3) verdict=INCONCLUSIVE ;;
          *) verdict=ERROR ;;
        esac
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "exit-code=$rc" >> "$GITHUB_OUTPUT"
        echo "## VibeHarness-MAS: $verdict (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
        echo "Report: \`$VH_OUTPUT\`$( [ -n "$VH_SARIF" ] && echo ", SARIF: \`$VH_SARIF\`" )" >> "$GITHUB_STEP_SUMMARY"
        if [ "$rc" -ge 4 ]; then echo "::error::VibeHarness-MAS could not complete the audit (exit $rc)"; exit "$rc"; fi
        case "$VH_FAIL_ON" in
          never) exit 0 ;;
          blocked) [ "$rc" -eq 2 ] && exit 1 ;;
          needs-fixes) [ "$rc" -eq 1 ] || [ "$rc" -eq 2 ] && exit 1 ;;
          inconclusive) [ "$rc" -ne 0 ] && exit 1 ;;
          *) echo "::error::unknown fail-on value '$VH_FAIL_ON'"; exit 5 ;;
        esac
        exit 0

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.output }}
          ${{ inputs.output }}.partial.json
          ${{ inputs.sarif }}
        if-no-files-found: ignore
