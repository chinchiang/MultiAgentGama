# 讓釘 SHA 的 Actions、鎖定的 Python 相依套件集、pre-commit hook 與沙盒基底映像保持最新。CI 的 `audit` job（對 requirements.lock 跑 pip-audit）
# 會在某個鎖定版本出現已知 CVE 時讓每個 PR 失敗，沒有這個設定就只能手動更新鎖定檔。
# Keeps the SHA-pinned Actions, the locked Python dependency set, the pre-commit hooks and the sandbox base images current. The CI `audit` job
# (pip-audit over requirements.lock) fails every PR once a locked version gains a known CVE, so
# without this the lock could only be refreshed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    # 根目錄：requirements.txt、requirements-dev.txt、requirements.lock 與 requirements-build.in／.txt；/docker：沙盒映像的
    # docker/sandbox-requirements.in／.txt。兩者在同一個分組 PR 裡升版，讓版本保持一致
    # （tests/test_review_build.py 會檢查沙盒鎖定檔與 requirements.lock 的版本相同）。
    # 兩份鎖定檔都是 uv 編譯、帶雜湊的通用鎖定檔；Dependabot 無法重新產生時，照各自檔頭的
    # uv pip compile 指令手動重建。
    # Root: requirements.txt, requirements-dev.txt, requirements.lock and requirements-build.in / .txt; /docker: the sandbox image's
    # docker/sandbox-requirements.in / .txt. Both are bumped in the same grouped PR so their versions stay
    # aligned (tests/test_review_build.py checks the sandbox lock matches requirements.lock). Both locks are
    # uv-compiled, hashed universal locks; when Dependabot cannot regenerate one, rebuild it by hand with
    # the uv pip compile command in its header.
    directories: ["/", "/docker"]
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 已在 requirements.txt／pyproject.toml 設上限；跨主版本升級是刻意的變更
      # Capped in requirements.txt / pyproject.toml; a major bump is a deliberate change
      - dependency-name: litellm
        update-types: ["version-update:semver-major"]
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]
      # requirements-build.txt 的建置後端：上限與 pyproject.toml 的 [build-system] 相同（<85），主版本要一起改
      # The build backend in requirements-build.txt: capped like pyproject.toml [build-system] (<85); bump both together
      - dependency-name: setuptools
        update-types: ["version-update:semver-major"]
  # .pre-commit-config.yaml 的 hook rev（ruff-pre-commit 釘在 commit SHA＋`# frozen: vX.Y.Z` 註解，Dependabot 會一起改）。
  # ruff 同時釘在 requirements-dev.txt（pip 生態系），兩邊是分開的 PR：tests/test_review_build.py 會在版本不一致時失敗，
  # 合併其中一個前把另一個也升到同版。
  # The hook revs in .pre-commit-config.yaml (ruff-pre-commit is pinned to a commit SHA + `# frozen: vX.Y.Z` comment,
  # which Dependabot updates together). ruff is also pinned in requirements-dev.txt (pip ecosystem) and the two arrive
  # as separate PRs: tests/test_review_build.py fails while they disagree, so bump the other one to the same version
  # before merging either.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      pre-commit-hooks:
        patterns: ["*"]
  # 沙盒映像的基底映像（以 tag＋index digest 釘死）／ Base images of the sandbox images (pinned by tag + index digest)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    groups:
      sandbox-base-images:
        patterns: ["*"]
    ignore:
      # Python／Node 的主次版本是刻意的選擇（3.12 與 CI 的發布直譯器一致，Node 22 是 TS 型別剝除的驗證版本）；只跟 digest 與 patch
      # The Python / Node major.minor is a deliberate choice (3.12 matches CI's release interpreter, Node 22 is the
      # version TS type stripping is validated on); follow digests and patches only
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
