# 讓釘 SHA 的 Actions 與鎖定的 Python 相依套件集保持最新。CI 的 `audit` job（對 requirements.lock 跑 pip-audit）
# 會在某個鎖定版本出現已知 CVE 時讓每個 PR 失敗，沒有這個設定就只能手動更新鎖定檔。
# Keeps the SHA-pinned Actions and the locked Python dependency set current. The CI `audit` job
# (pip-audit over requirements.lock) fails every PR once a locked version gains a known CVE, so
# without this the lock could only be refreshed by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # requirements.lock 是 uv 編譯的通用鎖定檔：Dependabot 把它當釘版的 requirements 檔升版，
    # `docker/sandbox.Dockerfile` 的釘版要手動跟著改。
    # requirements.lock is a uv-compiled universal lock: Dependabot bumps it like a pinned
    # requirements file, and `docker/sandbox.Dockerfile` pins must be updated to match by hand.
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # 已在 requirements.txt／pyproject.toml 設上限；跨主版本升級是刻意的變更
      # Capped in requirements.txt / pyproject.toml; a major bump is a deliberate change
      - dependency-name: litellm
        update-types: ["version-update:semver-major"]
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]
