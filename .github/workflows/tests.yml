name: tests

# push fires only for master; pull_request covers feature branches, so a PR no longer runs twice
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening); bump the tag in the comment
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      # Same pinned lint tools as local development (requirements-dev.txt), not unpinned latest
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy core/ agents/ runners/ reports/ main.py

  # Known-vulnerability audit of the exact locked dependency set; runs on every PR so a
  # dependency bump that introduces a CVE fails before merge
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit
      # --no-deps: the lock already contains the fully resolved tree (regenerate with
      # `uv pip compile --universal requirements.txt -o requirements.lock`)
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps

  # The installed wheel must run without the source checkout (it once shipped without config/*.yaml)
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --wheel
      - name: Install the wheel and run a mock audit outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; "$RUNNER_TEMP/venv/bin/vibeharness" --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # The Linux job builds the sandbox image and runs the real-container tests; budget generously
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      # Reproducible CI installs: exact pins from the uv-generated universal lock
      # (regenerate with: uv pip compile --universal requirements.txt -o requirements.lock)
      - run: python -m pip install -r requirements.lock
      # Linux runners have Docker: build the sandbox image so the real-container tests run instead of skipping
      - if: runner.os == 'Linux'
        run: |
          docker build -t vibeharness-sandbox:latest -f docker/sandbox.Dockerfile .
          echo "VIBEHARNESS_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"
      # Hermetic: the suite uses mock mode and a fake litellm, so no API keys are needed
      # Floor is the measured total minus headroom for OS matrix variance; raise as coverage grows
      - run: python -m pytest -q --cov=core --cov=agents --cov=runners --cov=reports --cov-report=term-missing --cov-fail-under=92
