name: tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      # Linux runners have Docker: build the sandbox image so the real-container tests run instead of skipping
      - if: runner.os == 'Linux'
        run: |
          docker build -t vibeharness-sandbox:latest -f docker/sandbox.Dockerfile .
          echo "VIBEHARNESS_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"
      # Hermetic: the suite uses mock mode and a fake litellm, so no API keys are needed
      - run: python -m pytest -q
