name: tests

# push 只對 master 觸發；pull_request 涵蓋功能分支，PR 不會跑兩次
# push fires only for master; pull_request covers feature branches, so a PR no longer runs twice
on:
  push:
    branches: [master]
  pull_request:
  # publish.yml 在發布前以 reusable workflow 呼叫，對 tag 指向的 commit 跑同一套檢查
  # publish.yml calls this as a reusable workflow before a release, running the same checks on the tagged commit
  workflow_call:

permissions:
  contents: read

# 同一個 PR／分支的新 push 會取消被取代的執行 ／ A newer push to the same PR / branch cancels the superseded run
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 第三方 action 釘在 commit SHA（供應鏈強化）；升版時同步改註解裡的 tag
      # Third-party actions are pinned to commit SHAs (supply-chain hardening); bump the tag in the comment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # 與本機開發相同的釘版 lint 工具（requirements-dev.txt），不用未釘版的最新版
      # Same pinned lint tools as local development (requirements-dev.txt), not unpinned latest
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy vibeharness/ main.py

  # 對鎖定的相依套件集做已知弱點稽核；每個 PR 都跑，帶進 CVE 的升版會在合併前失敗
  # Known-vulnerability audit of the exact locked dependency set; runs on every PR so a
  # dependency bump that introduces a CVE fails before merge
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # 和其他工具一樣釘在 requirements-dev.txt（Dependabot 會提議升版）
      # Pinned in requirements-dev.txt like every other tool (Dependabot proposes bumps)
      - run: python -m pip install "$(grep '^pip-audit==' requirements-dev.txt)"
      # 鎖定檔已含完整解析後、帶雜湊的相依樹；--require-hashes 讓沒有雜湊的項目直接失敗
      # （重新產生：見 requirements.lock 檔頭的 uv pip compile 指令）
      # The lock already holds the fully resolved, hashed tree; --require-hashes fails on any unhashed entry
      # (regenerate with the uv pip compile command in the header of requirements.lock)
      - run: python -m pip_audit -r requirements.lock --disable-pip --require-hashes

  # 安裝後的 wheel 必須在沒有原始碼 checkout 的情況下能跑（曾經漏掉 config/*.yaml）
  # The installed wheel must run without the source checkout (it once shipped without config/*.yaml)
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install "$(grep '^build==' requirements-dev.txt)"
      - run: python -m build
      - name: Install the wheel and run a mock audit outside the checkout ／ 安裝 wheel 並在 checkout 之外跑一次 mock 稽核
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; "$RUNNER_TEMP/venv/bin/vibeharness" --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md
      # sdist 必須自給自足：解開後（沒有 checkout）以鎖定的相依套件跑完整測試套件，
      # tests/test_review_build.py 另外比對 VIBEHARNESS_SDIST 指向的封存檔內容
      # The sdist must be self-contained: extract it (no checkout) and run the full suite against the locked
      # dependencies; tests/test_review_build.py also checks the archive VIBEHARNESS_SDIST points at
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Run the test suite from the extracted sdist ／ 在解開的 sdist 裡跑測試套件
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install --require-hashes -r requirements.lock
          sdist="$(ls "$PWD"/dist/*.tar.gz)"
          mkdir -p "$RUNNER_TEMP/sdist" && tar -xzf "$sdist" -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"/sdist/vibeharness_mas-*/
          VIBEHARNESS_SDIST="$sdist" "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -q -p no:cacheprovider

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS 只跑一格，用發布用的預設直譯器（那裡沒有 Docker：真容器測試會略過）
        # macOS once, on the default release interpreter (no Docker there: the real-container tests skip)
        include:
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    # Linux job 會建沙盒映像並跑真容器測試，時間預算放寬 ／ The Linux job builds the sandbox image and runs the real-container tests; budget generously
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      # 可重現的 CI 安裝：用 uv 產生、帶雜湊的通用鎖定檔精確釘版，--require-hashes 驗證每個下載的檔案
      # （重新產生：見 requirements.lock 檔頭的 uv pip compile 指令）
      # Reproducible CI installs: exact, hash-verified pins from the uv-generated universal lock
      # (regenerate with the uv pip compile command in the header of requirements.lock)
      - run: python -m pip install --require-hashes -r requirements.lock
      # JS/TS 測試以 Node 內建 runner 執行；釘在測試套件驗證過的版本
      # JS/TS tests run with Node's built-in runner; pin the version the suite is validated against
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: echo "VIBEHARNESS_REQUIRE_NODE=1" >> "$GITHUB_ENV"
        shell: bash
      # Linux runner 有 Docker：先建沙盒映像，讓真容器測試實跑而不是略過
      # Linux runners have Docker: build the sandbox image so the real-container tests run instead of skipping
      - if: runner.os == 'Linux'
        run: |
          docker build -t vibeharness-sandbox:latest -f docker/sandbox.Dockerfile .
          docker build -t vibeharness-sandbox-node:latest -f docker/sandbox-node.Dockerfile .
          echo "VIBEHARNESS_REQUIRE_DOCKER=1" >> "$GITHUB_ENV"
          echo "VIBEHARNESS_REQUIRE_DOCKER_NODE=1" >> "$GITHUB_ENV"
      # 封閉測試：套件用 mock 模式與假的 litellm，不需要任何 API 金鑰
      # 覆蓋率門檻＝實測總值減去跨 OS 矩陣的浮動空間；覆蓋率提高時再往上調
      # Hermetic: the suite uses mock mode and a fake litellm, so no API keys are needed
      # Floor is the measured total minus headroom for OS matrix variance; raise as coverage grows
      - run: python -m pytest -q --cov=vibeharness --cov-report=term-missing --cov-fail-under=93
