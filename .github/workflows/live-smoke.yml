name: live-smoke

# Manual, opt-in end-to-end run against real model providers. The hermetic test suite covers the
# live code paths with a fake litellm; this is the only check that exercises the providers, the
# JSON contracts of their answers and the sandbox on model-written tests. It needs the provider
# keys as repository secrets (ANTHROPIC_API_KEY, ZAI_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY);
# agents whose key is missing fall back to simulation in hybrid mode and the run is INCONCLUSIVE.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Directory to audit (relative to the checkout)"
        default: examples
      mode:
        description: "live (fail without a key) or hybrid (simulate agents without a key)"
        type: choice
        options: [live, hybrid]
        default: hybrid
      max_model_calls:
        description: "Cost guard: real model calls allowed for this run"
        default: "60"

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Audit with real models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          python main.py --target "${{ inputs.target }}" --mode "${{ inputs.mode }}" \
            --max-model-calls "${{ inputs.max_model_calls }}" --max-files 10 \
            --output live-report.md --sarif live-report.sarif --cache-dir .vibeharness-cache
          rc=$?
          set -e
          echo "exit code: $rc"
          # Verdict codes 0-3 are outcomes about the target; 4 (live call failed) and 5 (harness error) are failures
          if [ "$rc" -gt 3 ]; then echo "::error::live run failed (exit $rc)"; exit 1; fi
          # Same run as JSON, served from the response cache: no second round of provider calls
          python main.py --target "${{ inputs.target }}" --mode "${{ inputs.mode }}" \
            --max-model-calls 0 --max-files 10 --format json --output live-report.json \
            --cache-dir .vibeharness-cache || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-smoke-reports
          path: |
            live-report.md
            live-report.json
            live-report.sarif
            live-report.md.partial.json
          if-no-files-found: warn
