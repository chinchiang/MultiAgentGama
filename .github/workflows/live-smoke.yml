name: live-smoke

# 手動觸發、對真實模型供應商的端對端執行。封閉測試套件用假的 litellm 涵蓋 live 程式路徑；
# 這是唯一真正打到供應商、檢驗其回答的 JSON 合約、並讓沙盒跑模型寫的測試的檢查。
# 需要把供應商金鑰設成 repository secrets（ANTHROPIC_API_KEY、ZAI_API_KEY、DEEPSEEK_API_KEY、GEMINI_API_KEY）；
# 缺金鑰的 agent 在 hybrid 模式會退回模擬，執行結果為 INCONCLUSIVE。
# Manual, opt-in end-to-end run against real model providers. The hermetic test suite covers the
# live code paths with a fake litellm; this is the only check that exercises the providers, the
# JSON contracts of their answers and the sandbox on model-written tests. It needs the provider
# keys as repository secrets (ANTHROPIC_API_KEY, ZAI_API_KEY, DEEPSEEK_API_KEY, GEMINI_API_KEY);
# agents whose key is missing fall back to simulation in hybrid mode and the run is INCONCLUSIVE.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "要稽核的目錄（相對於 checkout）／ Directory to audit (relative to the checkout)"
        default: examples
      mode:
        description: "live（缺金鑰即失敗）或 hybrid（缺金鑰的 agent 改用模擬）／ live (fail without a key) or hybrid (simulate agents without a key)"
        type: choice
        options: [live, hybrid]
        default: hybrid
      max_model_calls:
        description: "成本防護：整個 workflow 允許的真實模型呼叫數（正整數；JSON 重跑用 --cache-only，不會再呼叫模型）／ Cost guard: real model calls for the whole workflow (positive integer; the JSON re-run uses --cache-only and makes no further model calls)"
        default: "60"

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Audit with real models ／ 以真實模型稽核
        # inputs 只經 env 傳入並一律加引號，絕不內插進腳本本文（這一步有供應商金鑰）
        # Inputs reach the script only through env and are always quoted, never interpolated into the
        # script body (this step holds the provider keys)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VH_TARGET: ${{ inputs.target }}
          VH_MODE: ${{ inputs.mode }}
          VH_MAX_CALLS: ${{ inputs.max_model_calls }}
        run: |
          # 驗證 inputs：mode 用允許清單；呼叫上限必須是正整數（0 對 CLI 代表不限，不能當成本防護）；
          # target 必須是 checkout 內的相對路徑
          # Validate the inputs: mode against an allow-list; the call cap must be a positive integer
          # (0 means unlimited to the CLI, which is no cost guard); target must be a relative path inside the checkout
          case "$VH_MODE" in
            live|hybrid) ;;
            *) echo "::error::mode must be live or hybrid"; exit 1 ;;
          esac
          if ! [[ "$VH_MAX_CALLS" =~ ^[1-9][0-9]{0,3}$ ]]; then
            echo "::error::max_model_calls must be a positive integer (1-9999)"; exit 1
          fi
          case "/$VH_TARGET/" in
            //*|*/../*) echo "::error::target must be a relative path inside the checkout without '..'"; exit 1 ;;
          esac
          if [ ! -e "$VH_TARGET" ]; then echo "::error::target does not exist in the checkout"; exit 1; fi
          set +e
          python main.py --target "$VH_TARGET" --mode "$VH_MODE" \
            --max-model-calls "$VH_MAX_CALLS" --max-files 10 \
            --output live-report.md --sarif live-report.sarif --cache-dir .vibeharness-cache
          rc=$?
          set -e
          echo "exit code: $rc"
          # 判定碼 0-3 是對目標的結論；4（live 呼叫失敗）與 5（harness 錯誤）才是失敗
          # Verdict codes 0-3 are outcomes about the target; 4 (live call failed) and 5 (harness error) are failures
          if [ "$rc" -gt 3 ]; then echo "::error::live run failed (exit $rc)"; exit 1; fi
          # 同一次執行改輸出 JSON：--cache-only 讓每個回答都從第一次執行的回應快取取用，絕不呼叫供應商，
          # 所以整個 workflow 最多只有 max_model_calls 次真實呼叫。第一次沒能快取的呼叫（失敗、無效或超出預算）
          # 是證據缺口；這裡固定用 hybrid，讓它們改用模擬並照樣寫出 JSON，而不是在 live 模式以 exit 4 中止
          # Same run as JSON: --cache-only serves every answer from the first run's response cache and never
          # calls a provider, so the whole workflow makes at most max_model_calls real calls. Calls the first
          # run could not cache (failed, invalid or over the budget) are evidence gaps; hybrid is used here so
          # they are simulated and the JSON is still written, instead of aborting with exit 4 in live mode
          python main.py --target "$VH_TARGET" --mode hybrid --cache-only \
            --max-files 10 --format json --output live-report.json \
            --cache-dir .vibeharness-cache || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-smoke-reports
          path: |
            live-report.md
            live-report.json
            live-report.sarif
            live-report.md.partial.json
          if-no-files-found: warn
