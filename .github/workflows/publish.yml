name: publish

# 推上版本 tag 時：先在 tag 指向的 commit 跑完整的 tests workflow，通過後建置 sdist／wheel、
# 在乾淨的 venv 對 wheel 做冒煙測試，再把同一批產物附到 GitHub Release 並以 Trusted Publishing 發布到 PyPI（見下）。
# On a version tag: run the full tests workflow on the tagged commit first; once it passes, build the
# sdist/wheel, smoke-test the wheel in a clean venv, attach those same artifacts to the GitHub Release and
# publish them to PyPI via Trusted Publishing (see below).
# 已知取捨：tag 指向的 commit 在合併到 master 時已跑過 tests，這裡會再跑一次；這是刻意的（發布前對確切的 commit 把關）
# Known trade-off: the tagged commit already ran tests when it was merged to master and runs them again here;
# that is deliberate (the exact commit is gated right before release)
on:
  push:
    tags:
      - "v*"

# 預設唯讀；只有建立 Release 的 job 拿到 contents: write
# Read-only by default; only the job that creates the Release gets contents: write
permissions:
  contents: read

jobs:
  # 與 PR 相同的完整檢查（lint、audit、package、測試矩陣），對 tag 指向的 commit 執行；沒過就不發布
  # The same full checks as a PR (lint, audit, package, test matrix), run on the tagged commit; no release unless green
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 第三方 action 釘在 commit SHA（供應鏈強化）；升版時同步改註解裡的 tag
      # Third-party actions are pinned to commit SHAs (supply-chain hardening); bump the tag in the comment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version ／ 核對 tag 與套件版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'from vibeharness import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION (vibeharness/__init__.py)"
            exit 1
          fi

      # build 釘在 requirements-dev.txt；建置後端（setuptools）從帶雜湊的 requirements-build.txt 安裝（範圍與 pyproject.toml 的
      # [build-system] 相同），以 --no-isolation 建置，發布產物用的就是這個驗證過的 setuptools
      # build is pinned in requirements-dev.txt; the build backend (setuptools) is installed from the hashed
      # requirements-build.txt (same range as pyproject.toml [build-system]) and the build runs with --no-isolation,
      # so the release artifacts come from that verified setuptools
      - name: Build sdist and wheel ／ 建置 sdist 與 wheel
        run: |
          python -m pip install --require-hashes -r requirements-build.txt
          python -m pip install "$(grep '^build==' requirements-dev.txt)"
          python -m build --no-isolation

      - name: Smoke-test the wheel in a clean venv ／ 在乾淨的 venv 對 wheel 冒煙測試
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/venv/bin/vibeharness" --version
          # 在 checkout 之外跑一次真的（mock 模式）稽核，安裝後的套件必須找得到自己附帶的設定檔；
          # 判定 exit code 0-3 正常，4/5 表示安裝壞了
          # Run a real (mock-mode) audit from outside the checkout, so the installed package must
          # find its own bundled config; verdict exit codes 0-3 are fine, 4/5 mean a broken install
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; "$RUNNER_TEMP/venv/bin/vibeharness" --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md

      # Release 內文 = CHANGELOG.en.md 中這個版本的區段（`## [X.Y.Z]` 到下一個 `## [` 或檔尾的連結定義，去掉頭尾空行）；
      # 找不到區段時檔案是空的，release job 改用 --generate-notes。tests/test_r3_repo_meta.py 會對 CHANGELOG 跑這段 awk
      # The Release body = this version's section of CHANGELOG.en.md (from `## [X.Y.Z]` to the next `## [` or the
      # link definitions at the bottom, leading/trailing blank lines trimmed); without a section the file is empty and
      # the release job falls back to --generate-notes. tests/test_r3_repo_meta.py runs this awk over the CHANGELOG
      - name: Extract release notes from CHANGELOG.en.md ／ 從 CHANGELOG.en.md 取出 Release 內文
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            !found { next }
            /^\[[^]]+\]: / { exit }
            !started && /^[[:space:]]*$/ { next }
            { started = 1; buf = buf $0 "\n"; if ($0 !~ /^[[:space:]]*$/) { printf "%s", buf; buf = "" } }
          ' CHANGELOG.en.md > "$RUNNER_TEMP/notes/release-notes.md"
          if [ -s "$RUNNER_TEMP/notes/release-notes.md" ]; then
            echo "Release notes: $(wc -l < "$RUNNER_TEMP/notes/release-notes.md") lines from CHANGELOG.en.md"
          else
            echo "::warning::No [${GITHUB_REF_NAME#v}] section in CHANGELOG.en.md; the Release falls back to generated notes"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/
          if-no-files-found: error

      # 同一批（已冒煙測試的）產物同時上 Release 與 PyPI：後面的 job 直接下載而不重建，兩邊位元相同
      # The same smoke-tested artifacts go to the Release and PyPI: the later jobs download them
      # instead of rebuilding, so both are bit-identical
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 只有這個 job 能寫入 repo：建立 Release 並上傳產物 ／ Only this job may write to the repo: create the Release and upload the artifacts
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/notes/
      # 內文用 CHANGELOG 的區段；Release 已存在（例如重跑）時改寫它的內文。沒有區段時新建的 Release 用 --generate-notes，
      # 已存在的 Release 保留原內文（gh release edit 沒有 --generate-notes）
      # The body is the CHANGELOG section; when the Release already exists (e.g. a re-run) its notes are rewritten.
      # Without a section a new Release uses --generate-notes and an existing one keeps its notes (gh release edit
      # has no --generate-notes)
      - name: Create or update the release and upload artifacts ／ 建立或更新 Release 並上傳產物
        env:
          GH_TOKEN: ${{ github.token }}
          # 沒有 checkout，gh 從這裡得知 repo ／ No checkout, so gh learns the repository from here
          GH_REPO: ${{ github.repository }}
        run: |
          notes_file="$RUNNER_TEMP/notes/release-notes.md"
          if [ -f "$notes_file" ] && grep -q '[^[:space:]]' "$notes_file"; then
            notes=(--notes-file "$notes_file")
          else
            notes=()
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "${#notes[@]}" -gt 0 ]; then
              gh release edit "$GITHUB_REF_NAME" "${notes[@]}"
            fi
          elif [ "${#notes[@]}" -gt 0 ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # 以 Trusted Publishing（OIDC）發布到 PyPI：repo 裡不存任何 API token。
  # 本 repo 已啟用：每個版本 tag 都會自動發布到 PyPI 的 vibeharness-mas（pypi.org 上的 Trusted Publisher 為
  # owner=chinchiang repository=MultiAgentGama workflow=publish.yml environment=pypi，且 repository variable
  # ENABLE_PYPI_PUBLISH=true）。PyPI 的版本不可覆寫：發錯版要發新的 patch 版本，不要重打 tag。
  # Fork 要停用時，不設或刪除 repository variable ENABLE_PYPI_PUBLISH（Settings > Secrets and variables > Actions > Variables），
  # 這個 job 就會被略過，產物只放在 GitHub Release；fork 沒有自己的 Trusted Publisher 設定時本來也無法上傳。
  # Live for this repository: every version tag publishes vibeharness-mas to PyPI automatically (the Trusted
  # Publisher on pypi.org is owner=chinchiang repository=MultiAgentGama workflow=publish.yml environment=pypi, and
  # the repository variable ENABLE_PYPI_PUBLISH=true). PyPI versions are immutable: a bad release needs a new patch
  # version, never a re-tag.
  # A fork disables it by leaving the repository variable ENABLE_PYPI_PUBLISH unset or deleting it (Settings >
  # Secrets and variables > Actions > Variables): this job is then skipped and the artifacts land only on the
  # GitHub Release; without its own Trusted Publisher a fork could not upload anyway.
  pypi-publish:
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # 用這個 workflow 的 OIDC token 換取短效的 PyPI 上傳 token ／ Exchange this workflow's OIDC token for a short-lived PyPI upload token
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # 釘在 commit SHA（不是 annotated tag 物件的 SHA）／ Pinned to the commit SHA (not the annotated tag object's SHA)
      - name: Publish to PyPI ／ 發布到 PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
