name: publish

# 推上版本 tag 時：先在 tag 指向的 commit 跑完整的 tests workflow，通過後建置 sdist／wheel、
# 在乾淨的 venv 對 wheel 做冒煙測試，再把同一批產物附到 GitHub Release；PyPI 發布需另行啟用（見下）。
# On a version tag: run the full tests workflow on the tagged commit first; once it passes, build the
# sdist/wheel, smoke-test the wheel in a clean venv, and attach those same artifacts to the GitHub Release.
# PyPI publishing is opt-in (see below).
on:
  push:
    tags:
      - "v*"

# 預設唯讀；只有建立 Release 的 job 拿到 contents: write
# Read-only by default; only the job that creates the Release gets contents: write
permissions:
  contents: read

jobs:
  # 與 PR 相同的完整檢查（lint、audit、package、測試矩陣），對 tag 指向的 commit 執行；沒過就不發布
  # The same full checks as a PR (lint, audit, package, test matrix), run on the tagged commit; no release unless green
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 第三方 action 釘在 commit SHA（供應鏈強化）；升版時同步改註解裡的 tag
      # Third-party actions are pinned to commit SHAs (supply-chain hardening); bump the tag in the comment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version ／ 核對 tag 與套件版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'from vibeharness import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION (vibeharness/__init__.py)"
            exit 1
          fi

      # build 釘在 requirements-dev.txt；建置後端（setuptools）的範圍在 pyproject.toml 的 [build-system]
      # build is pinned in requirements-dev.txt; the build backend (setuptools) range lives in pyproject.toml [build-system]
      - name: Build sdist and wheel ／ 建置 sdist 與 wheel
        run: |
          python -m pip install "$(grep '^build==' requirements-dev.txt)"
          python -m build

      - name: Smoke-test the wheel in a clean venv ／ 在乾淨的 venv 對 wheel 冒煙測試
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/venv/bin/vibeharness" --version
          # 在 checkout 之外跑一次真的（mock 模式）稽核，安裝後的套件必須找得到自己附帶的設定檔；
          # 判定 exit code 0-3 正常，4/5 表示安裝壞了
          # Run a real (mock-mode) audit from outside the checkout, so the installed package must
          # find its own bundled config; verdict exit codes 0-3 are fine, 4/5 mean a broken install
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; "$RUNNER_TEMP/venv/bin/vibeharness" --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md

      # 同一批（已冒煙測試的）產物同時上 Release 與（可選的）PyPI：後面的 job 直接下載而不重建，兩邊位元相同
      # The same smoke-tested artifacts go to the Release and (optionally) PyPI: the later jobs download them
      # instead of rebuilding, so both are bit-identical
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # 只有這個 job 能寫入 repo：建立 Release 並上傳產物 ／ Only this job may write to the repo: create the Release and upload the artifacts
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release (if missing) and upload artifacts ／ 建立 Release（若不存在）並上傳產物
        env:
          GH_TOKEN: ${{ github.token }}
          # 沒有 checkout，gh 從這裡得知 repo ／ No checkout, so gh learns the repository from here
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # 以 Trusted Publishing（OIDC）發布到 PyPI：repo 裡不存任何 API token。
  # 需另行啟用，因為要做一次只有 repo 擁有者能做的設定：
  # Publish to PyPI via Trusted Publishing (OIDC): no API token is stored in the repo.
  # Opt-in, because it needs one-time setup that only the repo owner can do:
  #   1. 在 pypi.org 把這個 repo 註冊為專案的 Trusted Publisher ／ On pypi.org, register this repo as a Trusted Publisher for the project:
  #      owner=chinchiang  repository=MultiAgentGama  workflow=publish.yml  environment=pypi
  #   2. 建立 repository variable ENABLE_PYPI_PUBLISH=true ／ Create the repository variable ENABLE_PYPI_PUBLISH=true
  #      (Settings > Secrets and variables > Actions > Variables)
  # 兩者都完成前這個 job 會被略過，產物只會放在 GitHub Release。
  # Until both are done this job is skipped and artifacts land only on the GitHub Release.
  pypi-publish:
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # 用這個 workflow 的 OIDC token 換取短效的 PyPI 上傳 token ／ Exchange this workflow's OIDC token for a short-lived PyPI upload token
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # 釘在 commit SHA（不是 annotated tag 物件的 SHA）／ Pinned to the commit SHA (not the annotated tag object's SHA)
      - name: Publish to PyPI ／ 發布到 PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
