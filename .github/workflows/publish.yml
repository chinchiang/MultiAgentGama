name: publish

# On a version tag: build the sdist/wheel, smoke-test the wheel, and attach
# the artifacts to the GitHub Release. PyPI publishing is opt-in (see below).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to commit SHAs (supply-chain hardening); bump the tag in the comment
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'from core import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION (core/__init__.py)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          vibeharness --version
          # Run a real (mock-mode) audit from outside the checkout, so the installed package must
          # find its own bundled config; verdict exit codes 0-3 are fine, 4/5 mean a broken install
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; vibeharness --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md

      - name: Create release (if missing) and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # Publish to PyPI via Trusted Publishing (OIDC): no API token is stored in the repo.
  # Opt-in, because it needs one-time setup that only the repo owner can do:
  #   1. On pypi.org, register this repo as a Trusted Publisher for the project:
  #      owner=chinchiang  repository=MultiAgentGama  workflow=publish.yml  environment=pypi
  #   2. Create the repository variable ENABLE_PYPI_PUBLISH=true
  #      (Settings > Secrets and variables > Actions > Variables)
  # Until both are done this job is skipped and artifacts land only on the GitHub Release.
  pypi-publish:
    if: vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: build-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      # Exchange this workflow's OIDC token for a short-lived PyPI upload token
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@106e0b0b7c337fa67ed433972f777c6357f78598 # v1.13.0
