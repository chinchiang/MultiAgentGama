name: publish

# On a version tag: build the sdist/wheel, smoke-test the wheel, and attach
# the artifacts to the GitHub Release. PyPI publishing is planned separately.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(python -c 'from core import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package version $PKG_VERSION (core/__init__.py)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          vibeharness --version
          # Run a real (mock-mode) audit from outside the checkout, so the installed package must
          # find its own bundled config; verdict exit codes 0-3 are fine, 4/5 mean a broken install
          mkdir -p "$RUNNER_TEMP/smoke" && cp examples/vibe_sample_app.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          set +e; vibeharness --target . --mode mock -o report.md; rc=$?; set -e
          if [ "$rc" -gt 3 ]; then echo "::error::installed wheel failed to run (exit $rc)"; exit 1; fi
          test -s report.md

      - name: Create release (if missing) and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
