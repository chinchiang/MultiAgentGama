# VibeHarness-MAS agent 設定檔 ／ VibeHarness-MAS Agent Configuration
# 把不同的 LLM 指派給各個 agent，以多模型去偏 ／ Supports multi-model de-biasing by mapping distinct LLMs to each agent

global:
  execution_mode: "hybrid"  # "live"（呼叫真實 API）、"mock"（離線／乾跑，供測試）或 "hybrid" ／ "live" (calls APIs), "mock" (offline/dry-run for testing), or "hybrid"
  timeout_seconds: 180            # 單次 LLM 請求逾時；16k 輸出上限下的長 JSON 曾讓 Opus 超過 60 秒 ／ per LLM request; long JSON at a 16k output cap took Opus over 60s
  max_retries: 2                  # 退回 fallback_model 前的 LLM 請求重試次數 ／ LLM request retries before falling back to fallback_model
  max_output_tokens: 16384        # 單次 LLM 回應上限（封頂值；思考 token 也算在內），模型自己的 max_output_tokens 可覆蓋；4096 在 live 實測會截斷威脅模型
                                  # per LLM response (a cap; reasoning tokens count against it); a model's own
                                  # max_output_tokens overrides it. 4096 truncated threat models in live runs
  max_model_calls: null           # 成本防護：每次執行的真實模型呼叫數（null = 不限）；用盡時 hybrid 退回模擬（不可能 READY_TO_SHIP）、live 直接失敗
                                  # cost guard: live model invocations per run (null = unlimited); when exhausted,
                                  # hybrid falls back to simulation (never READY_TO_SHIP), live fails
  max_concurrent_calls: 6         # 每個 agent 階段的並行模型呼叫數 ／ parallel model calls per agent phase
  max_files: 50                   # 每次分析的原始碼檔案數，其餘列為 skipped ／ source files analyzed per run; the rest are reported as skipped
  max_file_bytes: 1000000         # 超過此大小的單一檔案會被略過（證據缺口）：bundle、產生的程式碼 ／ a single source file above this size is skipped (evidence gap): bundles, generated code
  # include / exclude：以相對於 --target 的路徑（或檔名）比對的 glob；CLI 的 --include/--exclude 會覆蓋這兩個清單，
  # --changed-since <git ref> 再把範圍縮到有變更的檔案
  # include / exclude: glob patterns against the path relative to --target (or the file name); CLI --include/--exclude
  # override these lists, --changed-since <git ref> further restricts the run to files that changed
  include: []                     # 例如 ["src/*"]；空 = 全部 ／ e.g. ["src/*"]; empty = everything
  exclude: []                     # 例如 ["tests/*", "vendor/*", "*.min.js"] ／ e.g. ["tests/*", "vendor/*", "*.min.js"]
  cache_dir: null                 # 回應快取目錄（可用的 live 回答以模型＋提示為 key；命中時不呼叫供應商、不扣預算）；CLI --cache-dir 可覆蓋。
                                  # 裡面是原始的模型回答，請比照報告保管。null = 關閉
                                  # directory for the response cache (usable live answers keyed by model + prompt; a hit
                                  # makes no provider call and costs no budget); CLI --cache-dir overrides. Holds raw
                                  # model answers, so treat it like the reports. null = off
  retry_invalid_output: 1         # 模型回答無法使用（非 JSON、缺欄位、空回應）時再問幾次才記為 `invalid`；每次重問都是計入 max_model_calls 的真實呼叫
                                  # re-ask a model this many times when its answer is unusable (not JSON, missing keys,
                                  # empty) before booking it `invalid`; each re-ask is a real call against max_model_calls
  sandbox_provider: "local_subprocess"  # "local_subprocess"（不是安全邊界）或 "docker"（隔離容器）；e2b 規劃中 ／ "local_subprocess" (NOT a security boundary) or "docker" (isolated container); e2b is planned
  # 僅 docker provider；請先建映像：docker build -t vibeharness-sandbox:latest -f docker/sandbox.Dockerfile .
  # docker provider only; build the image first: docker build -t vibeharness-sandbox:latest -f docker/sandbox.Dockerfile .
  docker_image: "vibeharness-sandbox:latest"  # 需含 pytest、pytest-cov 與目標的相依套件 ／ must contain pytest, pytest-cov and the target's dependencies
  docker_network: "none"          # "none" 全斷網；黑箱測試要打執行中的服務時需改為例如 "host"（Linux）／ "none" blocks all network; black-box tests against a running service need e.g. "host" (Linux)
  docker_memory: "1g"
  docker_cpus: "2"
  docker_pids_limit: 256
  # JS/TS 目標：生成的 node:test 模組以 Node 內建 runner 執行（需 >= 20；TypeScript 的型別剝除需 >= 22.6）。
  # 找不到 runtime 時只是那些測試的證據缺口，不會在啟動時失敗。
  # JS/TS targets: generated node:test modules run with Node's built-in runner (>= 20; TypeScript needs >= 22.6 for
  # type stripping). A missing runtime is an evidence gap for those tests, never a start-up failure.
  node_bin: "node"
  sandbox_node_provider: null     # null = 跟隨 sandbox_provider；"local_subprocess" 或 "docker" ／ null = follow sandbox_provider; "local_subprocess" or "docker"
  docker_node_image: "vibeharness-sandbox-node:latest"  # docker build -t vibeharness-sandbox-node:latest -f docker/sandbox-node.Dockerfile .
  sandbox_timeout_seconds: 120    # 一個批次的總預算：整批 pytest，或一組（最多 10 個）JS/TS 模組 ／ budget for one batch: the batched pytest run, or one group of (up to) 10 JS/TS modules
  sandbox_memory_mb: 2048         # 僅 local_subprocess：pytest 程序樹的位址空間上限（RLIMIT_AS，POSIX；Node 改用 --max-old-space-size 限制堆積），
                                  # 另有批次預算 + 10 秒的 CPU 時間上限與單檔大小上限；0 只關閉記憶體上限（CPU 與檔案大小上限仍在）。不是安全邊界
                                  # local_subprocess only: address-space cap (RLIMIT_AS, POSIX; Node caps its heap with
                                  # --max-old-space-size instead) for the pytest process tree, besides a CPU-time cap of the
                                  # batch budget + 10 s and a per-file size cap; 0 disables the memory cap only (the CPU and
                                  # file-size caps stay). Not a security boundary
  # 突變測試（選用）：對已通過的白箱測試所涵蓋的函式做確定性的小改動，檢查測試會不會失敗；不呼叫模型。
  # CLI 的 --mutation／--no-mutation 優先於 mutation_testing；分數低於 mutation_min_score、被上限截斷或沒有結論時加證據缺口（不影響 NEEDS_FIXES）
  # Mutation testing (optional): applies small deterministic changes to the functions the passing white-box tests cover and
  # checks whether the tests fail; no model is called. CLI --mutation / --no-mutation wins over mutation_testing; a score below
  # mutation_min_score, a truncated mutant list or no conclusion adds an evidence gap (it never causes NEEDS_FIXES)
  mutation_testing: false
  mutation_max_mutants: 20        # 變異體上限，每個變異體一次沙盒批次；超過的略過並列為證據缺口 ／ mutant cap, one sandbox batch per mutant; the rest are skipped and listed as an evidence gap
  mutation_timeout_seconds: null  # 每個變異體的批次逾時（逾時算殺死）；null／0 = 跟隨 per_test_timeout_seconds ／ per-mutant batch timeout (a timeout counts as killed); null / 0 = follow per_test_timeout_seconds
  mutation_min_score: 70          # 百分比，低於它就加證據缺口 ／ percent, below it an evidence gap is added
  mutation_max_copy_mb: 200       # 複本大小上限（略過 SKIPPED_DIRS 後），超過就略過並記原因 ／ copy size cap (after SKIPPED_DIRS); above it the step is skipped with a reason
  per_test_timeout_seconds: 30    # 批次逾時後逐測重跑時，每個測試的預算 ／ budget per test when a timed-out batch is re-run test by test

models:
  # 供應商定義。`model`／`fallback_model` 是 litellm 的模型字串；金鑰從 api_key_env 讀取。
  # 主模型在 max_retries 之後仍失敗時，fallback_model 會被試一次。
  # 任何 agent 都可以透過 `model_alias` 指向下面任一模型——例如只有 Gemini 金鑰時，把每個 agent 的 model_alias 都設成
  # "gemini"。
  # 每個模型可選填：`price_per_million_input`／`price_per_million_output`（美元；讓 --estimate 印出費用）、
  # `max_output_tokens`（覆蓋全域上限）與 `extra_params`（原樣傳給 litellm 的 mapping，例如 {thinking: {type: disabled}}
  # 或 {reasoning_effort: low}，避免推理模型把整個輸出額度花在思考上）。
  # 供應鏈（OWASP LLM04:2026）：目標的原始碼會送到這裡列出的每一家供應商，只設定你接受其資料保留條款的供應商；
  # api_base 必須是 https（loopback 除外）。
  # Provider definitions. `model` / `fallback_model` are litellm model strings; the key is read from api_key_env.
  # fallback_model is tried once when the primary model still fails after max_retries.
  # Any agent can point at any model below via its `model_alias` — e.g. with only a Gemini key,
  # set every agent's model_alias to "gemini".
  # Optional per model: `price_per_million_input` / `price_per_million_output` (USD; lets --estimate print a cost),
  # `max_output_tokens` (overrides the global cap) and `extra_params`, a mapping passed
  # straight to litellm, e.g. {thinking: {type: disabled}} or {reasoning_effort: low} so a reasoning model
  # does not spend the whole output budget thinking.
  # Supply chain (OWASP LLM04:2026): target source code is sent to every provider listed here, so only
  # configure providers whose data-retention terms you accept; api_base must be https (loopback excepted).
  claude:
    model: "claude-sonnet-5-5"
    api_key_env: "ANTHROPIC_API_KEY"
    fallback_model: "claude-haiku-4-5-20251001"
    provider: "anthropic"

  glm:
    # 智譜 AI／Z.AI 的 GLM，經 litellm 的 zai provider ／ Zhipu AI / Z.AI GLM via litellm's zai provider
    model: "zai/glm-5.3"
    api_key_env: "ZAI_API_KEY"
    fallback_model: "zai/glm-5.3-flash"
    provider: "zhipu"

  deepseek:
    # 用帶版本的 id 而不是會變動的 deepseek-chat 別名，供應商端換模型時報告看得出來
    # Versioned ids rather than the moving deepseek-chat alias, so a provider-side swap is visible in reports
    model: "deepseek/deepseek-v4-pro"
    api_key_env: "DEEPSEEK_API_KEY"
    fallback_model: "deepseek/deepseek-v4-flash"
    provider: "deepseek"

  gemini:
    # gemini-2.5-flash 已不開放給新的 Google API 使用者，改用 3.x ／ gemini-2.5-flash is no longer available to new Google API users; use 3.x instead
    model: "gemini/gemini-3.8-flash"
    api_key_env: "GEMINI_API_KEY"
    fallback_model: "gemini/gemini-3.5-flash"
    provider: "google"

agents:
  # 1. 白箱 agent（多模型評議，消除單一模型偏差）／ White-Box Agents (Multi-Model Ensemble to eliminate bias)
  # 每個 whitebox_reviewer_* 項目都會被使用，各有自己的模型、名稱與 focus；增刪項目即可調整陣容。
  # 四個不同的模型家族讓彼此的盲點不重疊。
  # Every whitebox_reviewer_* entry is used, with its own model, name and focus; add or remove entries
  # to change the ensemble. Four different model families keep their blind spots from overlapping.
  whitebox_reviewer_claude:
    name: "Logic & State Reviewer (Claude)"
    model_alias: "claude"
    temperature: 0.2
    focus: "Deep logical edge cases, unhandled exception states, state inconsistencies, hidden null-pointer/type bugs"

  whitebox_reviewer_deepseek:
    name: "Safety & Defensive Reviewer (DeepSeek)"
    model_alias: "deepseek"
    temperature: 0.1
    focus: "Input sanitization, injection (SQL/command/path), defensive guards, resource exhaustion, unsafe concurrency"

  whitebox_reviewer_glm:
    name: "Specification & Contract Reviewer (GLM)"
    model_alias: "glm"
    temperature: 0.2
    focus: "API signature compliance, business specification adherence, contract violations, authorization checks (BOLA/BFLA)"

  whitebox_reviewer_gemini:
    name: "AI Integration & Supply-Chain Reviewer (Gemini)"
    model_alias: "gemini"
    temperature: 0.2
    focus: >-
      OWASP Top 10 for LLM Applications 2026 in code that calls models: untrusted input or retrieved content
      concatenated into prompts (LLM01), secrets or PII in prompts and logs (LLM02/LLM08), tools or agents
      acting without allowlists or human confirmation (LLM03), unpinned or unsafely loaded models and
      packages (LLM04/LLM05), uncapped tokens, loops and spend (LLM06), model output used unvalidated to
      decide or act (LLM07) or passed to eval/exec/shell/SQL/HTML (LLM10); also hard-coded credentials and
      unpinned third-party dependencies

  # 跨模型驗證：每個發現交給「其模型沒有回報該發現」的每位驗證者裁決，因此沒有模型會評審自己的發現。
  # 每個 whitebox_verifier_* 項目都會被使用（每個模型別名一位；同一別名的重複項目會被略過）；移除一個即不用那個模型。
  # Cross-model verification: each finding is ruled on by every verifier whose model did NOT report it,
  # so no model judges its own finding. Every whitebox_verifier_* entry is used (one per model alias; duplicates are
  # skipped); remove one to drop that model.
  whitebox_verifier_claude:
    name: "Finding Verifier (Claude)"
    model_alias: "claude"
    temperature: 0.0

  whitebox_verifier_deepseek:
    name: "Finding Verifier (DeepSeek)"
    model_alias: "deepseek"
    temperature: 0.0

  whitebox_verifier_glm:
    name: "Finding Verifier (GLM)"
    model_alias: "glm"
    temperature: 0.0

  whitebox_verifier_gemini:
    name: "Finding Verifier (Gemini)"
    model_alias: "gemini"
    temperature: 0.0

  whitebox_test_generator:
    name: "Property & Unit Test Generator"
    model_alias: "deepseek"
    temperature: 0.3
    role: "Generates executable pytest modules (node:test modules for JS/TS) targeting identified blindspots"

  # 2. 黑箱 agent（威脅模型驅動）／ Black-Box Agents (Threat-Model Driven)
  blackbox_threat_modeler:
    name: "STRIDE Threat Modeler Agent"
    model_alias: "claude"
    temperature: 0.2
    role: "Extracts trust boundaries, assets, and builds STRIDE, OWASP API and (for AI-integrated targets) OWASP LLM risk matrix"

  # 選 deepseek 是 live 實測的結果：GLM-5.3 在 12 個攻擊腳本中有 8 個把 16k 輸出額度全花在思考上（空回答），
  # Gemini 的安全過濾拒絕了一個（"content_filter"）；同一次執行的所有白箱測試都是 DeepSeek 產出的。
  # 拒絕與空回答會寫進報告，該威脅維持未測試。
  # deepseek, chosen from live runs: GLM-5.3 spent its whole 16k output budget thinking on 8 of 12 attack
  # scripts (empty answers), and Gemini's safety filter refused one ("content_filter"); DeepSeek produced
  # every white-box test of the same run. Refusals and empty answers are reported, the threat stays untested.
  blackbox_test_synthesizer:
    name: "Security Scenario & Exploit Test Generator"
    model_alias: "deepseek"
    temperature: 0.2
    role: "Translates threat scenarios into automated black-box tests (BOLA, Injection, Rate-limit, Prompt injection)"

  # 規劃中（尚未實作）：動態 fuzzing／DAST runner agent ／ Planned (not yet implemented): a dynamic fuzzing / DAST runner agent.
