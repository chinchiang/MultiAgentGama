# Vibe coding 的威脅建模規則與對應設定 ／ Threat Modeling Rules & Mapping Configuration for Vibe Coding
#
# 功能性欄位（由 agents/blackbox/threat_modeler.py 讀入，作為提示詞指引）：
# Functional fields (parsed by agents/blackbox/threat_modeler.py as prompt guidance):
#   - stride_categories.<key>.name / common_vibe_bugs
#   - owasp_api_top10[*].id / name
#   - owasp_llm_top10_2026[*].id / name / common_vibe_bugs / atlas_techniques（僅 AI 整合目標 ／ AI-integrated targets only）
# 本檔其餘欄位（code、description、target_components…）只是文件：harness 不會讀，改了也不影響執行。
# Everything else in this file (code, description, target_components, ...) is documentation:
# the harness never reads it, so edits there change nothing at runtime.
stride_categories:
  spoofing:
    code: "S"
    name: "Spoofing"
    description: "非法取得並使用他人的驗證資訊 ／ Illegally accessing and then using another user's authentication information"
    target_components: ["Auth headers", "JWT tokens", "Session cookies", "API keys", "Webhook signatures"]
    common_vibe_bugs:
      - "Trusting client-supplied user_id in headers or bodies without token claim validation"
      - "Forged webhook callbacks without HMAC-SHA256 signature verification"
      - "Weak or absent session revocation on password changes"

  tampering:
    code: "T"
    name: "Tampering"
    description: "惡意竄改資料、參數或設定 ／ Malicious modification of data, parameters, or configurations"
    target_components: ["Request payloads", "Database records", "URL query params", "Hidden form inputs"]
    common_vibe_bugs:
      - "Mass assignment / parameter injection updating unauthorized columns (e.g. is_admin=true, balance=99999)"
      - "Client-side price or discount calculation accepted without server-side recalculation"
      - "Missing optimistic concurrency locks leading to race conditions"

  repudiation:
    code: "R"
    name: "Repudiation"
    description: "可以否認做過某個動作而系統無法舉證 ／ Ability to deny performing an action without the system being able to prove it"
    target_components: ["Audit logs", "Transaction histories", "User activity streams"]
    common_vibe_bugs:
      - "Destructive actions (DELETE, transfer funds, role changes) performed without audit logs"
      - "Audit logs recording attacker-controlled strings without escaping (log injection)"

  information_disclosure:
    code: "I"
    name: "Information Disclosure"
    description: "把資訊暴露給無權查看的人 ／ Exposure of information to individuals not authorized to see it"
    target_components: ["Error responses", "Debug endpoints", "PII responses", "Database error logs"]
    common_vibe_bugs:
      - "Direct serialization of database models leaking hashed passwords, internal IDs, or salt"
      - "500 Internal Server Errors returning full stack traces, SQL queries, or file paths"
      - "Verbose exception messages detailing exact failure reasons (e.g., 'User exists, wrong password')"

  denial_of_service:
    code: "D"
    name: "Denial of Service"
    description: "以資源耗盡或觸發當機讓合法使用者無法使用服務 ／ Denying service to valid users through resource exhaustion or crash triggers"
    target_components: ["Pagination params", "Regex parsers", "File upload endpoints", "Async task queues"]
    common_vibe_bugs:
      - "Unbounded query parameters (e.g., ?limit=1000000) exhausting memory"
      - "ReDoS (evil regex patterns generated by AI for email/phone validation)"
      - "Synchronous handling of heavy computation or uncompressed payload decompression"

  elevation_of_privilege:
    code: "E"
    name: "Elevation of Privilege"
    description: "無權限的使用者取得功能或管理資源的特權存取 ／ Unprivileged user gains privileged access to functional or administrative resources"
    target_components: ["Role checks", "Route middleware", "Multi-tenant boundaries"]
    common_vibe_bugs:
      - "BOLA (Broken Object Level Authorization): user_id A can read/update user_id B's resource"
      - "BFLA (Broken Function Level Authorization): regular user can access /api/admin/* endpoints"
      - "Missing multi-tenant isolation checks in database queries (WHERE tenant_id missing)"

owasp_api_top10:
  - id: "API1:2023"
    name: "Broken Object Level Authorization (BOLA)"
    severity: "Critical"
  - id: "API2:2023"
    name: "Broken Authentication"
    severity: "Critical"
  - id: "API3:2023"
    name: "Broken Object Property Level Authorization"
    severity: "High"
  - id: "API4:2023"
    name: "Unrestricted Resource Consumption"
    severity: "High"
  - id: "API5:2023"
    name: "Broken Function Level Authorization (BFLA)"
    severity: "High"
  - id: "API6:2023"
    name: "Unrestricted Access to Sensitive Business Flows"
    severity: "Medium"
  - id: "API7:2023"
    name: "Server Side Request Forgery (SSRF)"
    severity: "High"
  - id: "API8:2023"
    name: "Security Misconfiguration"
    severity: "Medium"
  - id: "API9:2023"
    name: "Improper Inventory Management"
    severity: "Medium"
  - id: "API10:2023"
    name: "Unsafe Consumption of APIs"
    severity: "High"

# OWASP Top 10 for LLM Applications 2026（v1.0，2026-08）。只在目標匯入 AI／LLM SDK 時使用
# （見 agents/whitebox/ai_static_scanner.py）。功能性欄位：id / name / common_vibe_bugs。
# `cwe` 與 `atlas_tactics` 依 2026 文件附錄 A 的對應表（MITRE ATLAS 內容 v2026.06，tactic 層級）；
# `atlas_techniques` 是本 harness 自己的 technique 層級對應，已對照 ATLAS 2026.07 內容版本核對。
# 威脅建模 agent 會被要求用這些 technique id 填 atlas_mapping。
# OWASP Top 10 for LLM Applications 2026 (v1.0, 2026-08). Used only when the target imports an
# AI/LLM SDK (see agents/whitebox/ai_static_scanner.py). Functional fields: id / name / common_vibe_bugs.
# `cwe` and `atlas_tactics` follow the 2026 document's Appendix A mapping tables (MITRE ATLAS content
# v2026.06, tactic level); `atlas_techniques` is this harness's technique-level mapping, checked against
# ATLAS content release 2026.07. The threat modeler is told to use these technique ids for atlas_mapping.
owasp_llm_top10_2026:
  - id: "LLM01:2026"
    name: "Prompt Injection"
    cwe: ["CWE-1427", "CWE-707", "CWE-349", "CWE-693"]
    atlas_tactics: ["AML.TA0004", "AML.TA0005", "AML.TA0006", "AML.TA0007", "AML.TA0010", "AML.TA0001", "AML.TA0011", "AML.TA0012"]
    atlas_techniques: ["AML.T0051.000", "AML.T0051.001", "AML.T0054", "AML.T0068"]
    common_vibe_bugs:
      - "User input, retrieved documents, tool output or file content concatenated straight into the system/user prompt"
      - "No stripping of invisible Unicode (tag block U+E0000-E007F, variation selectors, zero-width) before the model or renderer"
      - "Access control or safety rules enforced only by prompt text instead of application code"
  - id: "LLM02:2026"
    name: "Sensitive Information Disclosure"
    cwe: ["CWE-200", "CWE-359", "CWE-212", "CWE-532", "CWE-285", "CWE-732", "CWE-201"]
    atlas_tactics: ["AML.TA0010", "AML.TA0013", "AML.TA0000", "AML.TA0007"]
    atlas_techniques: ["AML.T0057", "AML.T0055"]
    common_vibe_bugs:
      - "Whole database records or PII sent to an external model provider without a field allowlist"
      - "Full prompts, completions or reasoning traces written to logs/telemetry"
      - "Retrieval authorization applied after the vector query instead of inside it"
  - id: "LLM03:2026"
    name: "Excessive Agency"
    cwe: ["CWE-285", "CWE-732", "CWE-284", "CWE-770", "CWE-1427"]
    atlas_tactics: ["AML.TA0005", "AML.TA0011", "AML.TA0010", "AML.TA0012"]
    atlas_techniques: ["AML.T0053", "AML.T0086", "AML.T0101"]
    common_vibe_bugs:
      - "Open-ended tools (run shell command, fetch any URL, raw SQL) exposed to the model"
      - "Tools running with a broad service identity instead of the requesting user's permissions"
      - "Irreversible or external actions executed without human confirmation or a deterministic policy check"
  - id: "LLM04:2026"
    name: "Supply Chain"
    cwe: ["CWE-494", "CWE-829", "CWE-349", "CWE-664"]
    atlas_tactics: ["AML.TA0004", "AML.TA0003", "AML.TA0005", "AML.TA0006"]
    atlas_techniques: ["AML.T0010", "AML.T0011.000", "AML.T0060", "AML.T0109"]
    common_vibe_bugs:
      - "from_pretrained / hub downloads without a pinned revision, or with trust_remote_code=True"
      - "torch.load / pickle on downloaded model or data artifacts without hash or signature verification"
      - "AI-suggested dependencies installed without checking they exist (slopsquatting)"
  - id: "LLM05:2026"
    name: "Data and Model Poisoning"
    cwe: ["CWE-349", "CWE-829", "CWE-494", "CWE-1427"]
    atlas_tactics: ["AML.TA0003", "AML.TA0006", "AML.TA0011", "AML.TA0004", "AML.TA0001", "AML.TA0005"]
    atlas_techniques: ["AML.T0020", "AML.T0018", "AML.T0115"]
    common_vibe_bugs:
      - "User feedback or uploaded content fed into fine-tuning or RAG ingestion without validation or rate limits"
      - "Chat templates, tokenizer configs or adapters loaded without integrity checks"
  - id: "LLM06:2026"
    name: "Unbounded Consumption"
    cwe: ["CWE-400", "CWE-770", "CWE-664", "CWE-691", "CWE-829"]
    atlas_tactics: ["AML.TA0011", "AML.TA0010", "AML.TA0000"]
    atlas_techniques: ["AML.T0034", "AML.T0029"]
    common_vibe_bugs:
      - "Model calls without max_tokens, timeout, per-user rate limit or hard spend cap"
      - "Agent / tool-calling loops without step, recursion-depth or cost limits"
      - "No input-size check before sending user content to the model"
  - id: "LLM07:2026"
    name: "Misinformation"
    cwe: ["CWE-1426", "CWE-349", "CWE-494", "CWE-1427"]
    atlas_tactics: ["AML.TA0011", "AML.TA0003", "AML.TA0004", "AML.TA0001"]
    atlas_techniques: ["AML.T0062", "AML.T0060"]
    common_vibe_bugs:
      - "Model output used to decide or act (approve, refund, route, call a tool) without claim-check-act verification"
      - "Free-text answers parsed loosely instead of a strict schema with mandatory fields"
  - id: "LLM08:2026"
    name: "Hidden Context Exposure"
    cwe: ["CWE-200", "CWE-798", "CWE-693", "CWE-285"]
    atlas_tactics: ["AML.TA0008", "AML.TA0010", "AML.TA0002", "AML.TA0013"]
    atlas_techniques: ["AML.T0056", "AML.T0069.002", "AML.T0083"]
    common_vibe_bugs:
      - "API keys, connection strings or internal URLs placed in the system prompt or tool descriptions"
      - "Roles and permissions described in the prompt rather than enforced in code"
  - id: "LLM09:2026"
    name: "Vector and Embedding Weaknesses"
    cwe: ["CWE-200", "CWE-285", "CWE-359", "CWE-732", "CWE-829"]
    atlas_tactics: ["AML.TA0010", "AML.TA0001", "AML.TA0011", "AML.TA0008"]
    atlas_techniques: ["AML.T0070", "AML.T0080"]
    common_vibe_bugs:
      - "Tenant / user filter supplied by the client or applied after vector retrieval (cross-tenant leakage)"
      - "Untrusted and trusted documents mixed in one index; raw similarity scores returned to clients"
  - id: "LLM10:2026"
    name: "Improper Output Handling"
    cwe: ["CWE-1426", "CWE-116", "CWE-79", "CWE-707", "CWE-200", "CWE-201"]
    atlas_tactics: ["AML.TA0005", "AML.TA0010", "AML.TA0011", "AML.TA0012"]
    atlas_techniques: ["AML.T0077", "AML.T0050", "AML.T0102"]
    common_vibe_bugs:
      - "Model output passed to eval/exec, a shell, raw SQL or a file path"
      - "Model output rendered as HTML/Markdown without escaping (XSS, image-URL exfiltration)"
      - "Terminal/log output of model text without stripping ANSI/OSC control sequences"
