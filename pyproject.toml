[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeharness-mas"
# Single source of truth for the version: vibeharness/__init__.py
dynamic = ["version"]
description = "Multi-agent white-box and threat-modeled black-box testing harness for vibe-coded projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
# pytest / pytest-cov are runtime dependencies: the sandbox executes generated tests with them
dependencies = [
    "pydantic>=2.5.0,<3.0",
    "pyyaml>=6.0",
    # litellm is fast-moving with breaking changes between majors: cap it (matches requirements.txt)
    "litellm>=1.40.0,<2.0",
    # litellm does not pull this in itself; live mode with retries fails without it
    "tenacity>=8.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "typing-extensions>=4.9.0",
]

[project.scripts]
vibeharness = "vibeharness.cli:main"

[tool.setuptools.dynamic]
version = { attr = "vibeharness.__version__" }

[tool.setuptools.packages.find]
# Everything ships under the single `vibeharness` namespace (core / agents / runners / reports / config
# used to be top-level packages that collided with other installed packages of the same generic names).
# `vibeharness.config` is a data-only package: the gateway and the threat modeler resolve their default
# YAML files relative to the package, so the wheel must ship vibeharness/config/*.yaml
include = ["vibeharness*"]

[tool.setuptools.package-data]
"vibeharness.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep generated-test runs from picking up the harness's own tests or sample targets
norecursedirs = ["examples", "docs"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Conservative: real errors and likely bugs only, no style enforcement
select = ["E4", "E7", "E9", "F", "B"]

[tool.mypy]
python_version = "3.10"
# litellm / rich ship no type stubs
ignore_missing_imports = true
# Also type-check function bodies without annotations (free correctness win: no new errors surfaced)
check_untyped_defs = true
files = ["vibeharness", "main.py"]
